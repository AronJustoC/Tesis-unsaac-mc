[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "analisis_modal_3d"
version = "0.1.0"
description = "Herramienta para análisis modal de estructuras 3D"
authors = [{ name = "Aron", email = "aron@example.com" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["analisis_modal_3d*"]

